[package]
name = "agent-cli-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
rustyline = "15"
meval = "0.2"
chrono = "0.4"
futures-util = "0.3"
